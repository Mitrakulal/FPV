<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="data:," />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
    />
    <meta name="theme-color" content="#07080a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>FPV TX</title>
    <link rel="stylesheet" href="./style.css?v=5" />
  </head>
  <body>
    <div id="app">
      <header id="bar">
        <div class="pill" id="link"><span class="dot"></span><span id="linkText">offline</span></div>
        <div class="pill mono" id="rtt">-- ms</div>
        <div class="pill mono" id="rate">-- Hz</div>
        <button id="armBtn" class="arm" type="button">DISARMED</button>
        <button id="btnRestart" class="danger restart" type="button" aria-label="restart run">R</button>
        <button id="btnAngle" class="ghost" type="button">ACRO</button>
        <button id="btnSettings" class="ghost" type="button" aria-label="settings">SET</button>
        <button id="btnFull" class="ghost" type="button" aria-label="fullscreen">FULL</button>
      </header>

      <main id="field">
        <div class="column">
          <div class="cap">THR · YAW</div>
          <div class="stick" id="leftStick">
            <div class="ring"></div>
            <div class="tick t50"></div>
            <div class="tick t35"></div>
            <div class="knob" id="leftKnob"></div>
          </div>
          <div class="sub mono" id="leftRead">THR 0%</div>
        </div>

        <div class="mid">
          <div class="thr mono" id="thrBig">0%</div>
          <div class="cap">THROTTLE</div>
          <div class="hover">hover ≈ 35%</div>
          <div class="armed mono" id="armState">DISARMED</div>
          <div class="msg" id="msg"></div>
        </div>

        <div class="column">
          <div class="cap">PITCH · ROLL</div>
          <div class="stick" id="rightStick">
            <div class="ring"></div>
            <div class="knob" id="rightKnob"></div>
          </div>
          <div class="sub mono" id="rightRead">P 0 · R 0</div>
        </div>
      </main>

      <div class="hintbar">
        <span>Throttle holds where you leave it. Arm with throttle low.</span>
      </div>
    </div>

    <div id="sheet" hidden>
      <div class="sheetcard">
        <div class="sheethead">
          <strong>Transmitter</strong>
          <button id="btnClose" class="ghost" type="button">CLOSE</button>
        </div>

        <label class="row">
          <span>Stick mode</span>
          <select id="setMode">
            <option value="2">Mode 2 — throttle left</option>
            <option value="1">Mode 1 — throttle right</option>
          </select>
        </label>

        <label class="row">
          <span>Throttle</span>
          <select id="setThrottle">
            <option value="hold">HOLD — stays where you leave it</option>
            <option value="spring">SPRING to 35% — training</option>
          </select>
        </label>

        <label class="row">
          <span>Expo <em id="valExpo">0%</em></span>
          <input id="setExpo" type="range" min="0" max="100" step="1" value="0" />
        </label>

        <label class="row">
          <span>Deadband <em id="valDead">2%</em></span>
          <input id="setDead" type="range" min="0" max="10" step="1" value="2" />
        </label>

        <label class="row">
          <span>Stick size <em id="valSize">100%</em></span>
          <input id="setSize" type="range" min="70" max="130" step="5" value="100" />
        </label>

        <label class="row">
          <span>Haptics</span>
          <input id="setHaptics" type="checkbox" checked />
        </label>

        <label class="row">
          <span>Invert pitch</span>
          <input id="setInvPitch" type="checkbox" />
        </label>

        <label class="row">
          <span>Invert yaw</span>
          <input id="setInvYaw" type="checkbox" />
        </label>

        <div class="sheetfoot">
          <div class="mono" id="sheetInfo">—</div>
          <button id="btnReset" class="danger" type="button">RESET DEFAULTS</button>
        </div>
      </div>
    </div>

    <script type="module" src="./tx.js?v=5"></script>
  </body>
</html>
