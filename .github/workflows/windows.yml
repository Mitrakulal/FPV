name: Windows packages

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build portable ZIP and installer
        run: npm run package:win

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: fpv-rig-portable
          path: dist/release/*-portable.zip

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: fpv-rig-setup
          path: dist/release/*-Setup.exe

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: fpv-rig-release-docs
          path: |
            README.md
            LICENSE
            docs/DESKTOP.md
            dist/release/FPV-Rig-*/START-HERE.txt
            dist/release/FPV-Rig-*/THIRD-PARTY.md
          if-no-files-found: warn
